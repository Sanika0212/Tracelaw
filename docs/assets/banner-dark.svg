<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Tracelaw: learn the laws an agent's good runs obey, then find the first step where a new run breaks one">
  <rect width="1200" height="260" rx="18" fill="#1a1a19"/>
  <text x="56" y="118" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="64" font-weight="700" fill="#ffffff">Tracelaw</text>
  <text x="58" y="162" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" fill="#c3c2b7">Learn the laws your agent's good runs obey,</text>
  <text x="58" y="192" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" fill="#c3c2b7">then find the first step a run breaks one.</text>
  <rect x="610" y="132" width="40" height="18" rx="6" fill="#3987e5" fill-opacity="0.75"/><rect x="610" y="164" width="40" height="40" rx="8" fill="#222220" stroke="#383835" stroke-width="1.5"/><rect x="672" y="124" width="40" height="26" rx="6" fill="#3987e5" fill-opacity="0.75"/><rect x="672" y="164" width="40" height="40" rx="8" fill="#222220" stroke="#383835" stroke-width="1.5"/><rect x="734" y="136" width="40" height="14" rx="6" fill="#3987e5" fill-opacity="0.75"/><rect x="734" y="164" width="40" height="40" rx="8" fill="#222220" stroke="#383835" stroke-width="1.5"/><rect x="796" y="120" width="40" height="30" rx="6" fill="#3987e5" fill-opacity="0.75"/><rect x="796" y="164" width="40" height="40" rx="8" fill="#222220" stroke="#383835" stroke-width="1.5"/><rect x="858" y="128" width="40" height="22" rx="6" fill="#3987e5" fill-opacity="0.75"/><rect x="858" y="164" width="40" height="40" rx="8" fill="#222220" stroke="#383835" stroke-width="1.5"/><rect x="920" y="54" width="40" height="96" rx="6" fill="#e05252" fill-opacity="0.95"/><rect x="920" y="164" width="40" height="40" rx="8" fill="#222220" stroke="#e05252" stroke-width="2.5"/><rect x="982" y="80" width="40" height="70" rx="6" fill="#e05252" fill-opacity="0.95"/><rect x="982" y="164" width="40" height="40" rx="8" fill="#222220" stroke="#383835" stroke-width="1.5"/><rect x="1044" y="92" width="40" height="58" rx="6" fill="#e05252" fill-opacity="0.95"/><rect x="1044" y="164" width="40" height="40" rx="8" fill="#222220" stroke="#383835" stroke-width="1.5"/><line x1="596" y1="104" x2="1106" y2="104" stroke="#ffffff" stroke-width="2" stroke-dasharray="6 5"/><text x="1102" y="96" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" text-anchor="end" fill="#c3c2b7">alarm threshold (5% false alarms)</text><text x="940" y="226" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" text-anchor="middle" fill="#e05252">first broken law</text>
</svg>
