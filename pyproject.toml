[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tracelaw"
version = "0.1.0"
description = "Learn the laws an agent's good runs obey, then find the first step where a new run breaks one"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Sanika Najan", email = "sanikanajan@gmail.com" }]
requires-python = ">=3.11"
keywords = ["agents", "llm", "observability", "invariants", "anomaly-detection", "conformal-prediction", "debugging"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
    "Framework :: Pytest",
]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
bench = ["httpx>=0.27"]
viz = ["matplotlib>=3.9", "pillow>=10.4"]

[project.scripts]
tracelaw = "tracelaw.cli:main"

[project.entry-points.pytest11]
tracelaw = "tracelaw.pytest_plugin"

[project.urls]
Homepage = "https://github.com/Sanika0212/Tracelaw"
Issues = "https://github.com/Sanika0212/Tracelaw/issues"

[dependency-groups]
dev = ["pytest>=8.3", "hypothesis>=6.112", "ruff>=0.7", "mypy>=1.13", "coverage>=7.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/tracelaw"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT"]
# SIM905: word lists read better as one split string than as many quoted items.
ignore = ["RUF001", "RUF002", "RUF003", "SIM905"]

[tool.ruff.lint.per-file-ignores]
# Embedded CSS and HTML for the self-contained report; SVG templates in the figures.
"src/tracelaw/report.py" = ["E501"]
"scripts/make_figures.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src/tracelaw"]

[[tool.mypy.overrides]]
module = ["matplotlib.*", "httpx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -p no:cacheprovider"

[tool.coverage.run]
source = ["tracelaw"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
